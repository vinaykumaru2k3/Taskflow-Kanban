<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- [safari/mobile] Proper viewport with viewport-fit=cover for notch/Dynamic Island support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- [safari] Theme color for Safari browser chrome -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <!-- [perf] Preconnect to Google Fonts to speed up font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- [perf] Preload critical font weight -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>TaskFlow - Kanban Board</title>
    <meta name="description" content="TaskFlow - Modern Kanban board for high-performance teams. Plan, track and execute work with clarity." />
    <!-- [perf] Inline critical CSS: prevent dark mode flash on load -->
    <style>
      html { background: #ffffff; }
      html.dark { background: #0f172a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
